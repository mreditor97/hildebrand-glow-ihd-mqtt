---
name: Validate

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  schedule:
    # Daily, so a change in Home Assistant's or the Home Assistant
    # Marketplace's requirements shows up even without new commits
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: 🏠 Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
      - name: 🚀 Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  marketplace:
    name: 🛒 Home Assistant Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Home Assistant Marketplace validation
        uses: hacs/action@main
        with:
          category: integration
